interface:
  display_name: "Behavior Debug Board"
  short_description: "Create, diff, restore, and Git-version local behavior boards"
  default_prompt: "Use $behavior-debug-board to save this bug locally, ask about Git, and preserve semantic version history I can compare or restore."
dependencies:
  tools:
    - type: "mcp"
      value: "thesvg"
      description: "Search and fetch exact brand or service SVG logos"
policy:
  allow_implicit_invocation: true
