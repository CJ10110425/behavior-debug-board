# Move this file to .github/workflows/ci.yml after the publishing credential
# has GitHub's `workflow` OAuth scope.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run board:qa -- --port auto --flow after --final-step --screenshot outputs/ci-board.png
